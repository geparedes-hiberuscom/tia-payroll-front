server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React Router – redirige todo al index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend (reemplaza "backend" por el nombre de tu servicio)
    location /api/ {
        proxy_pass https://anton-unconvenable-bryanna.ngrok-free.dev/api/;
        proxy_set_header Host anton-unconvenable-bryanna.ngrok-free.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
